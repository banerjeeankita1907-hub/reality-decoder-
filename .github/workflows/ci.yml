name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend Python modules
        run: python -m py_compile app/backend/server.py app/backend/validation.py
      - name: Run standard-library validation tests
        env:
          PYTHONPATH: app/backend
        run: python -m unittest discover -s app/backend/tests -v
